<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512">
  <!-- Mission Control orbital emblem (same as the app header), on the deck's dark ground -->
  <defs>
    <linearGradient id="mc-emblem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="mc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1b1f3b"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="40" height="40" rx="9" fill="url(#mc-glow)"/>
  <g transform="translate(20 20) scale(0.9) translate(-20 -20)">
    <circle cx="20" cy="20" r="17" fill="none" stroke="url(#mc-emblem)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="80 27"/>
    <circle cx="20" cy="3" r="2" fill="#22d3ee"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
    <circle cx="32" cy="20" r="1.6" fill="#e879f9"/>
    <circle cx="8" cy="20" r="1.2" fill="#a3e635"/>
    <circle cx="20" cy="20" r="7.5" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
    <circle cx="20" cy="20" r="4.5" fill="url(#mc-emblem)"/>
  </g>
</svg>
